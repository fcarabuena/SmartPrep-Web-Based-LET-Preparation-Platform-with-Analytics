<div class="card question-card">
  <div class="card-body">
    <p class="fw-semibold mb-3">{{ q.stem|nl2br }}</p>
    {% for letter, text in q.choices.items() %}
    <div class="result-choice {% if letter == q.correct %}correct{% endif %}">
      <span class="choice-letter">{{ letter }}.</span> {{ text }} {% if letter == q.correct %}<i class="bi bi-check-circle-fill text-success ms-1" aria-label="correct answer"></i>{% endif %}
    </div>
    {% endfor %}
    {% if q.rationalization %}
    <div class="rationale mt-3 small"><div class="fw-semibold mb-1"><i class="bi bi-lightbulb"></i> Rationalization</div>{{ q.rationalization|nl2br }}</div>
    {% endif %}
  </div>
</div>
