{% extends "auth/auth_base.html" %}
{% block title %}Forgot password{% endblock %}
{% block auth_content %}
<h2 class="h4 fw-bold mb-1">Forgot your password?</h2>
<p class="text-muted mb-4">Enter your email and we'll send you a reset link (valid for 1 hour).</p>
<form method="post" action="/forgot">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <div class="mb-3">
    <label for="email" class="form-label">Email</label>
    <input type="email" class="form-control form-control-lg" id="email" name="email" autocomplete="email" required autofocus>
  </div>
  <button class="btn btn-primary btn-lg w-100" type="submit">Send reset link</button>
</form>
<p class="text-center mt-4 mb-0"><a href="/login"><i class="bi bi-arrow-left"></i> Back to sign in</a></p>
{% endblock %}
