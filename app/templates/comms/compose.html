{% extends "base.html" %}
{% block title %}Compose{% endblock %}
{% block page_title %}Inbox{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-xl-8">
  <a href="/inbox" class="small"><i class="bi bi-arrow-left"></i> Back to inbox</a>
  <div class="card mt-2">
    <div class="card-header fw-semibold">{{ 'Edit draft' if form.draft_id else 'New message' }}</div>
    <div class="card-body">
      <form method="post" action="/inbox/compose">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input type="hidden" name="thread_id" value="{{ form.thread_id }}">
        <input type="hidden" name="draft_id" value="{{ form.draft_id }}">
        <div class="row g-3">
          <div class="col-md-7"><label class="form-label" for="recipient_id">To</label>
            <select class="form-select" id="recipient_id" name="recipient_id">
              <option value="0">Choose recipient…</option>
              {% for role, users in recipients|groupby('role') %}
              <optgroup label="{{ role|capitalize }}">{% for u in users %}<option value="{{ u.id }}" {% if form.recipient_id == u.id %}selected{% endif %}>{{ u.full_name }} ({{ u.email }})</option>{% endfor %}</optgroup>
              {% endfor %}
            </select></div>
          <div class="col-md-5"><label class="form-label" for="course_id">Course (optional)</label>
            <select class="form-select" id="course_id" name="course_id"><option value="0">—</option>{% for c in courses %}<option value="{{ c.id }}" {% if form.course_id == c.id %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select></div>
          <div class="col-12"><label class="form-label" for="subject">Subject</label><input class="form-control" id="subject" name="subject" value="{{ form.subject }}" maxlength="255"></div>
          <div class="col-12"><label class="form-label" for="body">Message</label><textarea class="form-control" id="body" name="body" rows="8">{{ form.body }}</textarea></div>
        </div>
        <div class="d-flex gap-2 mt-3">
          <button class="btn btn-primary" type="submit" name="action" value="send"><i class="bi bi-send"></i> Send</button>
          <button class="btn btn-outline-secondary" type="submit" name="action" value="draft"><i class="bi bi-file-earmark"></i> Save draft</button>
        </div>
      </form>
    </div>
  </div>
</div></div>
{% endblock %}
